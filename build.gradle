plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.0.0'
group = 'de.rupturereborn'

base {
    archivesName = 'rupture-reborn-1.21.11'
}

// Minecraft 1.21.11 benötigt Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.11'
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.11-61.2.5')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
